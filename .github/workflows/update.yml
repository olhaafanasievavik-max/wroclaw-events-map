name: update map

on:
  schedule:
    - cron: "*/30 5-22 * * *"   # каждые 30 минут с 05:00 до 22:59 UTC (07-00 по Вроцлаву летом)
  workflow_dispatch:            # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: fetch new posts from Telegram
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
        run: python src/fetch_telegram.py

      - name: build events.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/build.py --translate

      - name: commit results
        run: |
          git config user.name "map-bot"
          git config user.email "map-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "update events $(date -u +'%Y-%m-%d %H:%M')"
          git push
