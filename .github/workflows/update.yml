name: update map

# GitHub запускает расписание не по расписанию: cron «каждые 30 минут» на деле
# срабатывал раз в 3-5 часов. Поэтому запуск теперь долгий: src/listen.py висит
# на связи с Telegram, отвечает боту сразу и раз в 30 минут читает каналы.
# Часовой cron нужен только чтобы поднять слушателя, если он завершился.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "docs/index.html", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-map
  cancel-in-progress: true      # новый запуск сменяет старого слушателя

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: listen for messages and keep the map fresh
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_CHANNELS: ${{ secrets.TG_CHANNELS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_OWNER_ID: ${{ secrets.TG_OWNER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LISTEN_MINUTES: "330"
          CHANNEL_EVERY_MIN: "30"
        run: python src/listen.py
